<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Robot body -->
  <rect x="32" y="48" width="64" height="56" rx="8" fill="url(#robotGradient)" stroke="#2D5A87" stroke-width="2"/>
  
  <!-- Robot head -->
  <rect x="40" y="24" width="48" height="32" rx="6" fill="url(#robotGradient)" stroke="#2D5A87" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="52" cy="36" r="4" fill="#FFFFFF"/>
  <circle cx="76" cy="36" r="4" fill="#FFFFFF"/>
  <circle cx="52" cy="36" r="2" fill="#2D5A87"/>
  <circle cx="76" cy="36" r="2" fill="#2D5A87"/>
  
  <!-- Antenna -->
  <line x1="64" y1="24" x2="64" y2="16" stroke="#2D5A87" stroke-width="2"/>
  <circle cx="64" cy="16" r="3" fill="#FF6B6B"/>
  
  <!-- Arms -->
  <rect x="20" y="60" width="12" height="24" rx="6" fill="url(#robotGradient)" stroke="#2D5A87" stroke-width="2"/>
  <rect x="96" y="60" width="12" height="24" rx="6" fill="url(#robotGradient)" stroke="#2D5A87" stroke-width="2"/>
  
  <!-- Hands -->
  <circle cx="26" cy="90" r="6" fill="#4A90E2" stroke="#2D5A87" stroke-width="2"/>
  <circle cx="102" cy="90" r="6" fill="#4A90E2" stroke="#2D5A87" stroke-width="2"/>
  
  <!-- Legs -->
  <rect x="44" y="104" width="12" height="20" rx="6" fill="url(#robotGradient)" stroke="#2D5A87" stroke-width="2"/>
  <rect x="72" y="104" width="12" height="20" rx="6" fill="url(#robotGradient)" stroke="#2D5A87" stroke-width="2"/>
  
  <!-- Chest panel -->
  <rect x="44" y="60" width="40" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <!-- Status indicators -->
  <circle cx="52" cy="68" r="2" fill="#4CAF50"/>
  <circle cx="60" cy="68" r="2" fill="#FFC107"/>
  <circle cx="68" cy="68" r="2" fill="#FF5722"/>
  <circle cx="76" cy="68" r="2" fill="#2196F3"/>
  
  <!-- Mouth -->
  <rect x="58" y="44" width="12" height="4" rx="2" fill="#2D5A87"/>
</svg>